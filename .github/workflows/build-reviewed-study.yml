name: Build reviewed Study bundle
on:
  pull_request:
    paths:
      - '.github/workflows/build-reviewed-study.yml'
permissions:
  contents: read
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ff144f75e11e6fe675c2de60c0fa0e56e50f50ad
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:study
      - run: sha256sum dist/study/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-study-ff144f75
          path: dist/study/index.js
          if-no-files-found: error
          retention-days: 1
