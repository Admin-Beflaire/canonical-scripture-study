name: Protected platform provisioning
on:
  workflow_dispatch:
    inputs:
      target:
        description: Terraform configuration (strict choice)
        required: true
        type: choice
        options: [github, cloudflare]
      operation:
        description: Explicit plan or apply
        required: true
        type: choice
        options: [plan, apply]
      commit:
        description: Exact reviewed 40-character SHA reachable from main
        required: true
        type: string
      approval:
        description: Type APPLY for apply operations; plan leaves this blank
        required: false
        type: string
      plan_run:
        description: Exact plan run-attempt identifier, shown in private plan asset names (apply only)
        required: false
        type: string
      plan_sha256:
        description: SHA-256 of the privately reviewed saved plan (apply only)
        required: false
        type: string
      initialize_empty_cloudflare:
        description: First Cloudflare state only, after external empty-resource inventory and owner approval
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: platform-state
  cancel-in-progress: false
jobs:
  platform:
    name: Protected platform execution
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: provisioning
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PLATFORM_STATE_REPO: ${{ vars.PLATFORM_STATE_REPO }}
      GITHUB_TOKEN: ${{ inputs.target == 'github' && secrets.PLATFORM_GITHUB_TOKEN || '' }}
      CLOUDFLARE_API_TOKEN: ${{ inputs.target == 'cloudflare' && secrets.PLATFORM_CLOUDFLARE_TOKEN || '' }}
      GITHUB_TFVARS: ${{ inputs.target == 'github' && secrets.PLATFORM_GITHUB_TFVARS_JSON || '' }}
      CLOUDFLARE_TFVARS: ${{ inputs.target == 'cloudflare' && secrets.PLATFORM_CLOUDFLARE_TFVARS_JSON || '' }}
      SELECTED_SHA: ${{ inputs.commit }}
      TARGET: ${{ inputs.target }}
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
      PLAN_RUN: ${{ inputs.plan_run }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      EMPTY_CLOUDFLARE: ${{ inputs.initialize_empty_cloudflare }}
      ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate authorization and exact committed code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET" == github || "$TARGET" == cloudflare ]] || exit 1
          [[ "$OPERATION" == plan || "$OPERATION" == apply ]] || exit 1
          [[ -n "$PLATFORM_STATE_REPO" ]] || exit 1
          if [[ "$OPERATION" == apply ]]; then
            [[ "$APPROVAL" == APPLY ]] || exit 1
            [[ "$PLAN_RUN" =~ ^[0-9]{1,20}-[0-9]{1,5}$ ]] || exit 1
            [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          else
            [[ -z "$APPROVAL" && -z "$PLAN_RUN" && -z "$PLAN_SHA256" ]] || exit 1
          fi
          if [[ "$EMPTY_CLOUDFLARE" == true ]]; then
            [[ "$TARGET" == cloudflare ]] || exit 1
          fi
          # Never run a PR or an arbitrary commit supplied by the dispatch caller.
          git cat-file -e "$SELECTED_SHA^{commit}"
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD
          # Keep security-sensitive state logic at the protected dispatch revision.
          cp infrastructure/github/platform_state.py "$RUNNER_TEMP/platform_state.py"
          # Run Terraform providers in a container isolated from host state authority.
          cat > "$RUNNER_TEMP/terraform_isolated.sh" <<'TF_ISOLATED'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,size=128m \
            --mount "type=bind,src=$WORK/config,dst=/workspace" \
            --mount "type=bind,src=$(command -v terraform),dst=/usr/local/bin/terraform,readonly" \
            --workdir /workspace --env HOME=/tmp --env TF_IN_AUTOMATION=1 \
            --env GITHUB_TOKEN --env CLOUDFLARE_API_TOKEN \
            ubuntu:24.04 /usr/local/bin/terraform "$@"
          TF_ISOLATED
          chmod 700 "$RUNNER_TEMP/terraform_isolated.sh"
          git checkout --detach "$SELECTED_SHA" >/dev/null 2>&1
          if [[ "$TARGET" == github ]]; then
            [[ -n "$GITHUB_TOKEN" && -n "$GITHUB_TFVARS" ]] || exit 1
          else
            [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_TFVARS" ]] || exit 1
          fi
          echo "Validated trusted platform configuration and dispatch"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Prepare isolated Terraform configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export WORK="$RUNNER_TEMP/gh02"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          export TF_IN_AUTOMATION=1
          if [[ "$TARGET" == github ]]; then
            printf '%s' "$GITHUB_TFVARS" > "$WORK/instance.auto.tfvars.json"
          else
            printf '%s' "$CLOUDFLARE_TFVARS" > "$WORK/instance.auto.tfvars.json"
          fi
          chmod 600 "$WORK/instance.auto.tfvars.json"
          mkdir -p "$WORK/config"
          cp -a "infrastructure/$TARGET/." "$WORK/config/"
          cp "$WORK/instance.auto.tfvars.json" "$WORK/config/instance.auto.tfvars.json"
          cd "$WORK/config"
          # No Terraform output in public logs, including provider diagnostics.
          "$RUNNER_TEMP/terraform_isolated.sh" init -backend=false -input=false -lockfile=readonly > "$WORK/init.log" 2>&1 || { echo "Terraform init blocked"; exit 1; }
          "$RUNNER_TEMP/terraform_isolated.sh" validate > "$WORK/validate.log" 2>&1 || { echo "Terraform validation blocked"; exit 1; }
      - name: Restore verified private state
        id: restore
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$EMPTY_CLOUDFLARE" == true ]]; then EXTRA+=(--allow-empty); fi
          python3 "$RUNNER_TEMP/platform_state.py" restore --key "$TARGET" --path "$WORK/config/terraform.tfstate" "${EXTRA[@]}" || exit 1
          echo "Verified private state boundary"
      - name: Create readable and binary private plan
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/terraform_isolated.sh" plan -input=false -lock=false -no-color -out=plan.tfplan > "$WORK/plan.log" 2>&1 || { echo "Terraform plan blocked"; exit 1; }
          "$RUNNER_TEMP/terraform_isolated.sh" show -no-color plan.tfplan > "$WORK/plan-review.txt" 2>&1 || { echo "Terraform show blocked"; exit 1; }
      - name: Save exact plan to private release for owner review
        if: inputs.operation == 'plan'
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$EMPTY_CLOUDFLARE" == true ]]; then EXTRA+=(--allow-empty); fi
          python3 "$RUNNER_TEMP/platform_state.py" plan-save --key "$TARGET" --run "$ATTEMPT_ID" --commit "$SELECTED_SHA" --path "$WORK/config/plan.tfplan" --review-path "$WORK/plan-review.txt" "${EXTRA[@]}"
          echo "Private plan saved: review the plan-run assets and manifest digest before a separate apply dispatch"
      - name: Retrieve exact owner-approved plan
        if: inputs.operation == 'apply'
        id: apply_plan
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$EMPTY_CLOUDFLARE" == true ]]; then EXTRA+=(--allow-empty); fi
          python3 "$RUNNER_TEMP/platform_state.py" plan-fetch --key "$TARGET" --plan-run "$PLAN_RUN" --commit "$SELECTED_SHA" --plan-sha256 "$PLAN_SHA256" --path "$WORK/config/apply.tfplan" "${EXTRA[@]}"
          echo "Owner-supplied digest matches stored binary plan, configuration and baseline"
      - name: Record begin marker before any apply
        id: begin
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        if: inputs.operation == 'apply' && steps.apply_plan.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/platform_state.py" begin --key "$TARGET" --run "$ATTEMPT_ID"
      - name: Apply checked plan (no public output)
        id: apply
        if: inputs.operation == 'apply' && steps.begin.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/config"
          "$RUNNER_TEMP/terraform_isolated.sh" apply -input=false -no-color apply.tfplan > "$WORK/apply.log" 2>&1 || { echo "Terraform apply failed; state reconciliation required"; exit 1; }
          echo "Terraform apply returned success (provider readback remains separate)"
      - name: Preserve state after success or partial failure
        id: finish
        if: always() && inputs.operation == 'apply' && steps.begin.outcome == 'success'
        shell: bash
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          cd "$WORK/config"
          [[ -s terraform.tfstate ]] || { echo "No state file: reconciliation required"; exit 1; }
          ARG=()
          if [[ "$APPLY_OUTCOME" == success ]]; then ARG+=(--success); fi
          python3 "$RUNNER_TEMP/platform_state.py" finish --key "$TARGET" --run "$ATTEMPT_ID" --path terraform.tfstate "${ARG[@]}"
      - name: Rescue state privately if normal state finalization fails
        if: always() && inputs.operation == 'apply' && steps.begin.outcome == 'success' && steps.finish.outcome != 'success'
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$WORK/config/terraform.tfstate" ]] || { echo "No local state to rescue; manual reconciliation required"; exit 1; }
          python3 "$RUNNER_TEMP/platform_state.py" rescue --key "$TARGET" --run "$ATTEMPT_ID" --path "$WORK/config/terraform.tfstate"
          echo "Private rescue copy verified; apply remains blocked pending independent reconciliation"
      - name: Sanitize temporary private data
        if: always()
        shell: bash
        run: |
          if [[ -n "${WORK:-}" && -d "$WORK" ]]; then rm -rf -- "$WORK"; fi
          echo "Platform run finished; plan/apply/state status must be read separately"
