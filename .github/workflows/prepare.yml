name: Preparation unit
# Control dispatches one fixed job envelope per unit on reviewed main (Platform GitHub To-Be §2–3).
# The job stays in the event file: it is never placed in a step environment or a shell command,
# because public run logs show step environments. Detailed diagnostics go only to Control's
# private result record. This workflow never merges, deploys, approves scope or selects data.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Control's canonical maintenance-job/1 envelope (Control sets this)
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.route.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Validate job envelope and route to one fixed job
        id: route
        env:
          PYTHONPATH: packages/shared-python/src:services/maintenance/data-preparation/src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -uo pipefail
          status="$RUNNER_TEMP/preparation-status.txt"
          python3 -m css_preparation.runner --validate --status "$status" > /dev/null 2>&1
          code=$?
          cat "$status" 2>/dev/null || echo "Preparation job input refused; no work started."
          exit "$code"

  acquire:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.kind == 'acquire'
    runs-on: ubuntu-24.04
    environment: preparation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Run acquisition unit with output captured privately
        env:
          PYTHONPATH: packages/shared-python/src:services/maintenance/data-preparation/src
          PYTHONDONTWRITEBYTECODE: '1'
          CONTROL_ORIGIN: ${{ secrets.CONTROL_ORIGIN }}
          PREPARATION_ACCESS_CLIENT_ID: ${{ secrets.PREPARATION_ACCESS_CLIENT_ID }}
          PREPARATION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPARATION_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PREPARATION_CLOUDFLARE_TOKEN: ${{ secrets.PREPARATION_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          status="$RUNNER_TEMP/preparation-status.txt"
          python3 -m css_preparation.runner --kind acquire --status "$status" > "$RUNNER_TEMP/preparation-private.log" 2>&1
          code=$?
          rm -f -- "$RUNNER_TEMP/preparation-private.log"
          if [[ -s "$status" ]]; then cat "$status"; cat "$status" >> "$GITHUB_STEP_SUMMARY"; else echo "Preparation runner stopped before reporting; Control reconciles this run."; fi
          exit "$code"

  prepare:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.kind == 'prepare'
    runs-on: ubuntu-24.04
    environment: preparation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Run preparation and indexing unit with output captured privately
        env:
          PYTHONPATH: packages/shared-python/src:services/maintenance/data-preparation/src
          PYTHONDONTWRITEBYTECODE: '1'
          CONTROL_ORIGIN: ${{ secrets.CONTROL_ORIGIN }}
          PREPARATION_ACCESS_CLIENT_ID: ${{ secrets.PREPARATION_ACCESS_CLIENT_ID }}
          PREPARATION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPARATION_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PREPARATION_CLOUDFLARE_TOKEN: ${{ secrets.PREPARATION_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          status="$RUNNER_TEMP/preparation-status.txt"
          python3 -m css_preparation.runner --kind prepare --status "$status" > "$RUNNER_TEMP/preparation-private.log" 2>&1
          code=$?
          rm -f -- "$RUNNER_TEMP/preparation-private.log"
          if [[ -s "$status" ]]; then cat "$status"; cat "$status" >> "$GITHUB_STEP_SUMMARY"; else echo "Preparation runner stopped before reporting; Control reconciles this run."; fi
          exit "$code"

  quality:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.kind == 'quality'
    runs-on: ubuntu-24.04
    environment: preparation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Run candidate quality check with output captured privately
        env:
          PYTHONPATH: packages/shared-python/src:services/maintenance/data-preparation/src
          PYTHONDONTWRITEBYTECODE: '1'
          CONTROL_ORIGIN: ${{ secrets.CONTROL_ORIGIN }}
          PREPARATION_ACCESS_CLIENT_ID: ${{ secrets.PREPARATION_ACCESS_CLIENT_ID }}
          PREPARATION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPARATION_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PREPARATION_CLOUDFLARE_TOKEN: ${{ secrets.PREPARATION_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          status="$RUNNER_TEMP/preparation-status.txt"
          python3 -m css_preparation.runner --kind quality --status "$status" > "$RUNNER_TEMP/preparation-private.log" 2>&1
          code=$?
          rm -f -- "$RUNNER_TEMP/preparation-private.log"
          if [[ -s "$status" ]]; then cat "$status"; cat "$status" >> "$GITHUB_STEP_SUMMARY"; else echo "Preparation runner stopped before reporting; Control reconciles this run."; fi
          exit "$code"
