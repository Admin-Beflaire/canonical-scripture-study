name: Preparation unit
# The title GitHub records for each run carries the SHA-256 of its job, so Control can match a run
# to its dispatch independently (a content digest, not an identifier).
run-name: Preparation ${{ inputs.dispatch_ref }}
# Control dispatches one fixed job envelope per unit on reviewed main (Platform GitHub To-Be §2–3).
# The job stays in the event file: it is never placed in a step environment or a shell command,
# because public run logs show step environments. Plain settings (Control origin, account, database,
# bucket, service-token client ID) are environment variables; only the two credentials are secrets.
# One job runs every kind: the runner reads the kind from the job. Failures are printed as one
# safe error record per `::error` annotation (our own messages only, never source text or secrets).
# No merge, deployment, scope approval or data selection occurs here.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Control's canonical maintenance-job/1 envelope (Control sets this)
        required: true
        type: string
      dispatch_ref:
        description: SHA-256 of the job text (Control sets this; the runner refuses a mismatch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preparation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: preparation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Run the preparation unit
        env:
          PYTHONPATH: packages/shared-python/src:services/maintenance/data-preparation/src
          PYTHONDONTWRITEBYTECODE: '1'
          CONTROL_ORIGIN: ${{ vars.CONTROL_ORIGIN }}
          PREPARATION_ACCESS_CLIENT_ID: ${{ vars.PREPARATION_ACCESS_CLIENT_ID }}
          PREPARATION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPARATION_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
          PREPARATION_CLOUDFLARE_TOKEN: ${{ secrets.PREPARATION_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          status="$RUNNER_TEMP/preparation-status.txt"
          # GitHub runs bash with -e: capture the exit code so the status line is still printed.
          code=0
          python3 -m css_preparation.runner --status "$status" || code=$?
          if [[ -s "$status" ]]; then cat "$status"; cat "$status" >> "$GITHUB_STEP_SUMMARY"; else echo "Preparation runner stopped before reporting; Control reconciles this run."; fi
          exit "$code"
