name: Reconcile Cloudflare state
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type RECONCILE to repair the identified failed state
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: platform-state
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'RECONCILE'
    runs-on: ubuntu-24.04
    environment: provisioning
    timeout-minutes: 25
    env:
      PLATFORM_STATE_REPO: ${{ vars.PLATFORM_STATE_REPO }}
      ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TF_IN_AUTOMATION: '1'
      PYTHONPATH: ${{ github.workspace }}/packages/shared-python/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Recover private snapshot, import existing namespace and verify provider
        id: recover
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLATFORM_CLOUDFLARE_TOKEN }}
          PLATFORM_CF_ACCOUNT_ID: ${{ vars.PLATFORM_CF_ACCOUNT_ID }}
          PLATFORM_CF_ZONE_NAME: ${{ vars.PLATFORM_CF_ZONE_NAME }}
          PLATFORM_CF_ACCESS_ISSUER: ${{ vars.PLATFORM_CF_ACCESS_ISSUER }}
          PLATFORM_CF_OWNER_EMAIL: ${{ vars.PLATFORM_CF_OWNER_EMAIL }}
          PLATFORM_CF_STUDY_OWNER_EMAIL: ${{ vars.PLATFORM_CF_STUDY_OWNER_EMAIL }}
          PLATFORM_CF_OAUTH_REDIRECT_URIS: ${{ vars.PLATFORM_CF_OAUTH_REDIRECT_URIS }}
          PLATFORM_CF_INSTANCE: ${{ vars.PLATFORM_CF_INSTANCE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/reconcile-cloudflare"
          mkdir -p "$WORK/config"
          cp -a infrastructure/cloudflare/. "$WORK/config/"
          python3 infrastructure/github/reconcile_cloudflare_state.py prepare "$WORK/config/terraform.tfstate"
          python3 infrastructure/github/cloudflare_inputs.py "$WORK/config/instance.auto.tfvars.json"
          cd "$WORK/config"
          tf() {
            stage=$1
            shift
            terraform "$@" > "$WORK/$stage.log" 2>&1 || {
              status=$?
              python3 -P -m css_shared.tool_log terraform --tool reconcile --stage "$stage" --exit "$status" --log "$WORK/$stage.log" --id run="$ATTEMPT_ID" || true
              exit 1
            }
          }
          tf init init -input=false -lockfile=readonly -no-color
          tf import import -input=false -no-color cloudflare_workers_kv_namespace.verified_word_cache "$PLATFORM_CF_ACCOUNT_ID/8071e577bb1a49ddb0aad5d3f230bc31"
          tf refresh apply -refresh-only -auto-approve -input=false -no-color
          tf plan plan -input=false -no-color -out="$WORK/plan.tfplan"
          python3 -P -m css_shared.tool_log terraform --tool reconcile --stage plan --log "$WORK/plan.log" --id run="$ATTEMPT_ID" || true
          terraform show -json "$WORK/plan.tfplan" > "$WORK/plan.json"
          python3 "$GITHUB_WORKSPACE/infrastructure/github/reconcile_cloudflare_state.py" verify-plan "$WORK/plan.json"
          echo 'Provider plan contains no configuration changes'
      - name: Publish verified recovery baseline
        if: steps.recover.outcome == 'success'
        env:
          PLATFORM_STATE_TOKEN: ${{ secrets.PLATFORM_STATE_TOKEN }}
        run: python3 infrastructure/github/reconcile_cloudflare_state.py publish "$RUNNER_TEMP/reconcile-cloudflare/config/terraform.tfstate"
      - name: Remove private local files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/reconcile-cloudflare"
