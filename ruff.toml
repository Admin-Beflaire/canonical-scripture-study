target-version = "py312"

[lint]
# E, W: PEP 8 (pycodestyle). F: unused imports and variables, undefined names.
# B: common bug patterns. N: PEP 8 naming. C90: function complexity.
# PLR0915: function size (statements). RUF100: a noqa comment that no longer
# suppresses anything must be removed.
select = ["E", "W", "F", "B", "N", "C90", "PLR0915", "RUF100"]
# The formatter decides where lines wrap.
ignore = ["E501"]

[lint.mccabe]
# Same limit as the ESLint complexity rule in eslint.config.mjs.
max-complexity = 15

[lint.pylint]
max-statements = 50

[format]
# Baseline (added with the code standard checks): existing files not yet formatted with `ruff format`.
# New files must be formatted. Remove a file from this list in the same change
# that formats it; never add a file here.
exclude = [
  "infrastructure/github/cloudflare_inputs.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/berean_units.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/language_aid_entries.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/oshb/bdb.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/commit.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/lexicon.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/lsj.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/rules.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/tipnr.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/tvtms.py",
  "services/maintenance/data-preparation/src/css_preparation/adapters/stepbible/units.py",
  "services/maintenance/data-preparation/src/css_preparation/executor/basis.py",
  "services/maintenance/data-preparation/src/css_preparation/indexes/source.py",
  "services/maintenance/data-preparation/src/css_preparation/indexes/word.py",
  "services/maintenance/data-preparation/src/css_preparation/prepare/literary.py",
  "services/maintenance/data-preparation/src/css_preparation/prepare/unit_builder.py",
  "services/maintenance/data-preparation/src/css_preparation/prepare/unit_starts.py",
  "services/maintenance/data-preparation/src/css_preparation/runner/control.py",
  "services/maintenance/data-preparation/src/css_preparation/runner/r2.py",
  "services/maintenance/data-preparation/src/css_preparation/runner/web.py",
  "services/maintenance/data-preparation/src/css_preparation/validation.py",
  "tools/check_python_boundaries.py",
  "tools/compare_tvtms.py",
]
